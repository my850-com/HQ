<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦞 Sherlock Mission Control</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #12121a;
            --card-light: #1a1a25;
            --cyan: #00f5d4;
            --purple: #a855f7;
            --orange: #f97316;
            --green: #22c55e;
            --red: #ef4444;
            --blue: #3b82f6;
            --text: #f8fafc;
            --text-muted: #64748b;
            --border: rgba(255,255,255,0.08);
        }
        
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .grid {
            position: fixed; inset: 0;
            background: 
                linear-gradient(rgba(0,245,212,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,245,212,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: grid 30s linear infinite;
            pointer-events: none; z-index: 0;
        }
        @keyframes grid {
            from { transform: perspective(1000px) rotateX(55deg) translateY(0); }
            to { transform: perspective(1000px) rotateX(55deg) translateY(60px); }
        }
        
        header {
            background: rgba(18,18,26,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative; z-index: 100;
        }
        
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            animation: iconPulse 2s infinite;
        }
        @keyframes iconPulse { 50% { transform: scale(1.08); box-shadow: 0 0 30px rgba(0,245,212,0.5); } }
        
        h1 { font-size: 18px; font-weight: 800; background: linear-gradient(135deg, var(--cyan), white); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .connection-status {
            display: flex; align-items: center; gap: 10px;
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            padding: 6px 14px; border-radius: 20px;
        }
        .status-live { background: rgba(34,197,94,0.1); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
        .status-demo { background: rgba(249,115,22,0.1); color: var(--orange); border: 1px solid rgba(249,115,22,0.3); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; animation: dotPulse 0.6s infinite; }
        .status-live .status-dot { background: var(--green); }
        .status-demo .status-dot { background: var(--orange); animation: none; }
        @keyframes dotPulse { 50% { opacity: 0.3; transform: scale(1.3); } }
        
        .data-age { font-size: 10px; color: var(--text-muted); margin-left: 8px; }
        
        .control-center {
            display: grid;
            grid-template-columns: 260px 1fr 300px;
            gap: 16px;
            padding: 16px;
            max-width: 1800px;
            margin: 0 auto;
            height: calc(100vh - 76px);
            position: relative; z-index: 10;
        }
        
        .panel { display: flex; flex-direction: column; gap: 12px; }
        
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            position: relative;
        }
        
        .card-glow::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--cyan), var(--purple));
            animation: borderFlow 2s linear infinite;
        }
        @keyframes borderFlow { from { transform: translateX(-100%); } to { transform: translateX(100%); } } }
        
        .agent-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .agent-avatar {
            width: 48px; height: 48px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
        }
        .agent-avatar.sherlock {
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            animation: avatarGlow 3s infinite;
        }
        @keyframes avatarGlow { 50% { box-shadow: 0 0 25px 5px rgba(0,245,212,0.3); } }
        
        .agent-status { display: flex; flex-direction: column; }
        .agent-status h3 { font-size: 14px; font-weight: 600; }
        .status-badge {
            font-family: 'JetBrains Mono', monospace; font-size: 10px;
            color: var(--green); background: rgba(34,197,94,0.1);
            padding: 2px 8px; border-radius: 10px; margin-top: 4px;
        }
        
        .demo-badge {
            font-family: 'JetBrains Mono', monospace; font-size: 10px;
            color: var(--orange); background: rgba(249,115,22,0.15);
            padding: 2px 8px; border-radius: 10px; margin-top: 4px;
            border: 1px dashed var(--orange);
        }
        
        .task-box {
            background: var(--card-light);
            border-radius: 8px;
            padding: 10px;
            border-left: 2px solid var(--cyan);
        }
        .task-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        #currentTask { font-size: 12px; margin-top: 4px; font-weight: 500; }
        
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .metric-box {
            background: var(--card-light); border-radius: 8px;
            padding: 12px; text-align: center;
        }
        .metric-value {
            font-family: 'JetBrains Mono', monospace; font-size: 18px;
            font-weight: 700; color: var(--cyan);
        }
        .metric-value.cost { color: var(--orange); }
        .metric-value.demo { color: var(--text-muted); }
        .metric-value.warn { color: var(--red); }
        .metric-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; }
        
        .pipeline-container { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: calc(100vh - 200px); }
        
        .flow-node {
            background: linear-gradient(90deg, rgba(0,245,212,0.05), transparent);
            border: 1px solid rgba(0,245,212,0.2);
            border-radius: 10px; padding: 14px;
            display: flex; align-items: center; gap: 14px;
            transition: all 0.3s ease;
        }
        .flow-node:hover { border-color: rgba(0,245,212,0.4); transform: translateX(4px); }
        .flow-node.active {
            border-color: var(--cyan);
            background: linear-gradient(90deg, rgba(0,245,212,0.1), rgba(168,85,247,0.05));
            animation: nodePulse 1.5s infinite;
        }
        @keyframes nodePulse { 50% { box-shadow: 0 0 25px rgba(0,245,212,0.25); } }
        
        .node-icon {
            width: 40px; height: 40px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; background: rgba(0,245,212,0.1);
        }
        .flow-node.active .node-icon { animation: spin 1s linear infinite 50% { transform: rotate(180deg); } to { transform: rotate(360deg); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } } }
        
        .node-content { flex: 1; }
        .node-title { font-size: 13px; font-weight: 600; }
        .node-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .demo-text { font-size: 10px; color: var(--orange); font-style: italic; }
        
        .progress-mini { width: 50px; height: 3px; background: var(--card-light); border-radius: 2px; overflow: hidden; margin-top: 6px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--purple)); animation: progressMove 3s ease-in-out infinite; }
        @keyframes progressMove { 0%,100% { width: 30%; } 50% { width: 70%; } } }
        
        .log-container { height: 200px; overflow-y: auto; }
        
        .log-entry {
            display: flex; gap: 10px; padding: 8px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            margin-bottom: 3px;
            animation: slideIn 0.3s ease;
            border-left: 2px solid;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } }
        
        .log-entry.exec { background: rgba(249,115,22,0.08); border-left-color: var(--orange); }
        .log-entry.read { background: rgba(59,130,246,0.08); border-left-color: var(--blue); }
        .log-entry.edit { background: rgba(168,85,247,0.08); border-left-color: var(--purple); }
        .log-entry.write { background: rgba(0,245,212,0.08); border-left-color: var(--cyan); }
        .log-entry.browser { background: rgba(34,197,94,0.08); border-left-color: var(--green); }
        .log-entry.demo { background: rgba(148,163,184,0.05); border-left-color: var(--text-muted); opacity: 0.7; }
        
        .log-time { color: var(--text-muted); min-width: 36px; font-size: 10px; }
        .log-tool { color: var(--cyan); min-width: 45px; font-weight: 600; text-transform: uppercase; }
        .log-tool.demo { color: var(--text-muted); }
        
        canvas { max-height: 180px; }
        
        .context-bar {
            position: relative; height: 20px;
            background: var(--card-light); border-radius: 4px;
            overflow: hidden;
        }
        .context-fill {
            position: absolute; left: 0; top: 0; height: 100%;
            background: linear-gradient(90deg, var(--cyan), var(--purple));
            transition: width 0.5s ease;
        }
        .context-fill.warn { background: linear-gradient(90deg, var(--orange), var(--red)); }
        .context-fill.demo { background: linear-gradient(90deg, var(--text-muted), #475569); }
    </style>
</head>
<body>
    <div class="grid"></div>
    
    <header>
        <div class="brand">
            <div class="brand-icon">🦞</div>
            <h1>MISSION CONTROL</h1>
        </div>
        <div class="connection-status status-live" id="connectionStatus">
            <span class="status-dot"></span>
            <span id="modeText">LIVE</span>
            <span class="data-age" id="dataAge"></span>
        </div>
    </header>
    
    <div class="control-center">
        <!-- LEFT -->
        <div class="panel">
            <div class="card card-glow">
                <div class="agent-header">
                    <div class="agent-avatar sherlock">🦞</div>
                    <div class="agent-status">
                        <h3>Sherlock</h3>
                        <span class="status-badge">ACTIVE</span>
                    </div>
                </div>
                <div class="task-box">
                    <div class="task-label">Current Task</div>
                    <div id="currentTask">Loading...</div>
                </div>
            </div>
            
            <div class="card">
                <div class="agent-header">
                        h3>Lars</h3>
                    <div class="agent-avatar" style="background:linear-gradient(135deg,var(--orange),#fbbf24);">👤</div>
                        <span class="status-badge" style="background:rgba(249,115,22,0.1);color:var(--orange);">IDLE</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="metrics-grid">
                    <div class="metric-box">
                        <div class="metric-value" id="tokensPerMin">--</div>
                        <div class="metric-label">Tokens/min</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-value cost" id="sessionCost">$--</div>
                        <div class="metric-label">Session Cost</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-value" id="totalTokens">--</div>
                        <div class="metric-label">Total</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-value" id="cacheHits">--%</div>
                        <div class="metric-label">Cache</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- CENTER -->
        <div class="panel">
            <div class="card" style="flex:1;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <span style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;">Active Workflows</span>
                    <span class="status-dot"></span>
                </div>
                <div class="pipeline-container" id="workflows"></div>
            </div>
            
            <div class="card">
                <div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Recent Activity</div>
                <div class="log-container" id="logContainer"></div>
            </div>
        </div>
        
        <!-- RIGHT -->
        <div class="panel">
            <div class="card">
                <div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Token Burn</div>
                <canvas id="tokenChart"></canvas>
            </div>
            <div class="card">
                <div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Tool Usage</div>
                <canvas id="toolChart"></canvas>
            </div>
            <div class="card">
                <div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12:px;"">Context Usage</div>
                <div class="context-bar">
                    <div class="context-fill" id="contextBar" style="width:0%;"></div>
                </div>
                <div style="display:flex;justify-content:space-between;margin-top:8px;">
                    <span style="font-family:JetBrains Mono;font-size:11px;color:var(--text-muted);"><span id="contextUsed">--</span>k / 262k</span>
                    <span id="contextPercent" style="font-family:JetBrains Mono;font-size:11px;color:var(--cyan);">--%</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Configuration
        const MAX_DATA_AGE_MINUTES = 16; // Your requirement
        const DATA_URL = 'session-data.json'; // Relative to office.html
        
        let sessionData = null;
        let isLive = false;
        
        // Demo data fallback
        const demoData = {
            mode: 'DEMO',
            lastUpdate: new Date().toISOString(),
            session: {
                tokensIn: 456000,
                tokensOut: 4200,
                tokensCached: 89000,
                cost: 0.24,
                contextUsed: 89000,
                contextTotal: 262144,
                cacheHitPercent: 45
            },
            currentTask: 'Simulated: Monitoring systems',
            workflows: [
                { name: 'MVP Pipeline', desc: 'Processing CSV data (Demo)', status: 'Processing', progress: 65, active: true },
                { name: 'Git Operations', desc: 'Deploy ready (Demo)', status: 'Idle', progress: 0, active: false },
                { name: 'Data Analysis', desc: 'Queued (Demo)', status: 'Queued', progress: 0, active: false }
            ],
            recentActivity: [
                { time: '21:15', tool: 'exec', message: 'git push origin main' },
                { time: '21:12', tool: 'write', message: 'Created office.html' },
                { time: '21:10', tool: 'read', message: 'index.html' },
                { time: '21:08', tool: 'edit', message: 'Updated styles.css' },
                { time: '20:55', tool: 'browser', message: 'Snapshot HQ dashboard' }
            ],
            tools: { exec: 12, read: 24, edit: 18, write: 8, browser: 6, web: 4 }
        };
        
        // Fetch real data
        async function fetchSessionData() {
            try {
                const response = await fetch(DATA_URL + '?t=' + Date.now());
                if (!response.ok) throw new Error('Fetch failed');
                const data = await response.json();
                
                // Check age
                const lastUpdate = new Date(data.lastUpdate);
                const now = new Date();
                const ageMinutes = (now - lastUpdate) / (1000 * 60);
                
                if (ageMinutes > MAX_DATA_AGE_MINUTES) {
                    console.log('Data is stale (' + Math.round(ageMinutes) + ' min old), using demo data');
                    sessionData = { ...demoData, mode: 'STALE' };
                    isLive = false;
                } else {
                    sessionData = data;
                    isLive = true;
                }
            } catch (e) {
                console.log('No session data available, using demo mode');
                sessionData = demoData;
                isLive = false;
            }
            
            updateUI();
        }
        
        function updateUI() {
            const data = sessionData;
            const s = data.session;
            
            // Update connection status
            const statusEl = document.getElementById('connectionStatus');
            const ageEl = document.getElementById('dataAge');
            
            if (isLive) {
                statusEl.className = 'connection-status status-live';
                document.getElementById('modeText').textContent = 'LIVE';
                ageEl.textContent = '';
            } else {
                statusEl.className = 'connection-status status-demo';
                document.getElementById('modeText').textContent = 'DEMO';
                ageEl.textContent = '(simulated)';
            }
            
            // Update metrics with demo indicator
            const metricClass = isLive ? '' : 'demo';
            document.getElementById('tokensPerMin').className = 'metric-value ' + metricClass;
            document.getElementById('tokensPerMin').textContent = Math.round(s.tokensIn / 1000 * 0.1) || '--';
            document.getElementById('sessionCost').textContent = '$' + s.cost.toFixed(2);
            document.getElementById('totalTokens').textContent = (s.tokensIn / 1000).toFixed(1) + 'k';
            document.getElementById('cacheHits').textContent = s.cacheHitPercent + '%';
            
            // Current task
            document.getElementById('currentTask').textContent = data.currentTask;
            if (!isLive) {
                document.getElementById('currentTask').className = 'demo-text';
            }
            
            // Context bar
            const percent = Math.round((s.contextUsed / s.contextTotal) * 100);
            const bar = document.getElementById('contextBar');
            bar.style.width = percent + '%';
            bar.className = 'context-fill' + (isLive ? '' : ' demo') + (percent > 80 ? ' warn' : '');
            document.getElementById('contextUsed').textContent = (s.contextUsed / 1000).toFixed(0);
            document.getElementById('contextPercent').textContent = percent + '%';
            document.getElementById('contextPercent').style.color = percent > 80 ? 'var(--red)' : (isLive ? 'var(--cyan)' : 'var(--text-muted)');
            
            // Workflows
            renderWorkflows(data.workflows, isLive);
            
            // Activity log
            renderActivityLog(data.recentActivity, isLive);
        }
        
        function renderWorkflows(workflows, live) {
            const container = document.getElementById('workflows');
            container.innerHTML = workflows.map(w => `
                <div class="flow-node ${w.active ? 'active' : ''}">
                    <div class="node-icon">${w.active ? '⚡' : (w.status === 'Idle' ? '🔄' : '📊')}</div>
                    <div class="node-content">
                        <div class="node-title">${w.name}</div>
                        <div class="node-desc">${w.desc} ${!live ? '<span style="color:var(--orange)">(Demo)</span>' : ''}</div>
                    </div>
                    ${w.active ? '<div class="progress-mini"><div class="progress-fill"></div></div>' : ''}
                </div>
            `).join('');
        }
        
        function renderActivityLog(activities, live) {
            const container = document.getElementById('logContainer');
            container.innerHTML = activities.map(a => `
                <div class="log-entry ${a.tool}${!live ? ' demo' : ''}">
                    <span class="log-time">${a.time}</span>
                    <span class="log-tool${!live ? ' demo' : ''}">${a.tool}</span>
                    <span>${a.message} ${!live ? '<span style="opacity:0.5">(sim)</span>' : ''}</span>
                </div>
            `).join('');
        }
        
        // Init charts
        function initCharts() {
            const colors = ['#f97316', '#3b82fс', '#a855f7', '#00f5d4', '#94a3b8', '#22c55e'];
            
            // Token line
            const ctx1 = document.getElementById('tokenChart').getContext('2d');
            new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: ['0', '5', '10', '15', '20', '25'],
                    datasets: [{
                        data: [0, 89, 245, 412, 589, 782],
                        borderColor: '#00f5d4',
                        backgroundColor: 'rgba(0,245,212,0.1)',
                        tension: 0.4, fill: true, pointRadius: 0
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { display: false }, y: { display: false } }
                }
            });
            
            // Tool doughnut
            const ctx2 = document.getElementById('toolChart').getContext('2d');
            new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['exec', 'read', 'edit', 'write', 'browser', 'image'],
                    datasets: [{
                        data: [12, 24, 18, 8, 6, 4],
                        backgroundColor: colors
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '70%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#94a3b8', font: { size: 9 }, boxWidth: 8, padding: 6 }
                        }
                    }
                }
            });
        }
        
        // Start
        initCharts();
        fetchSessionData();
        
        // Auto-refresh every 2 minutes (30x faster than your 16-min requirement)
        setInterval(fetchSessionData, 2 * 60 * 1000);
    </script>
</body>
</html>
